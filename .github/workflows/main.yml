name: Build OpenCV 4.13.0 x86 VS2022 Stable

on: 
  workflow_dispatch:

jobs:
  build_x86:
    runs-on: windows-2022

    steps:
      - name: Download OpenCV 4.13.0 Source
        shell: pwsh
        run: |
          # 从官方源下载 OpenCV 4.13.0
          Write-Host "正在下载 OpenCV 4.13.0..."
          $url = "https://github.com/opencv/opencv/archive/refs/tags/4.13.0.zip"
          Invoke-WebRequest -Uri $url `
            -OutFile "opencv.zip" `
            -UseBasicParsing
          
          Write-Host "正在解压..."
          Expand-Archive -Path opencv.zip -DestinationPath . -Force
          
          Write-Host "正在重命名文件夹..."
          Rename-Item -Path "opencv-4.13.0" -NewName "opencv_src" -Force
          
          Write-Host "下载完成！"
          dir opencv_src

      - name: Install Dependencies
        run: |
          choco install cmake -y
          cmake --version

      - name: Configure CMake for Win32
        run: |
          cmake -S opencv_src -B build_x86 `
            -G "Visual Studio 17 2022" -A Win32 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_opencv_world=ON `
            -DBUILD_EXAMPLES=OFF `
            -DBUILD_TESTS=OFF `
            -DBUILD_PERF_TESTS=OFF `
            -DBUILD_JAVA=OFF `
            -DINSTALL_CREATE_DISTRIB=ON `
            -DCMAKE_INSTALL_PREFIX=install

      - name: Build Debug & Release
        run: |
          cmake --build build_x86 --config Debug --target INSTALL -j 4
          cmake --build build_x86 --config Release --target INSTALL -j 4

      - name: Upload Finished Libs
        uses: actions/upload-artifact@v4
        with:
          name: OpenCV-4.13.0-VS2022-x86
          path: build_x86/install/
