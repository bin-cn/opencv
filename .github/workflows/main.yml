name: Build OpenCV 4.1.3 x86 VS2022

on: 
  workflow_dispatch: # 支持手动点击运行

jobs:
  build_x86:
    runs-on: windows-2022

    steps:
      - name: Checkout Official OpenCV 4.1.3
        uses: actions/checkout@v4
        with:
          repository: opencv/opencv
          ref: 4.1.3  # 精确指向官方 4.1.3 标签
          path: opencv_src

      - name: Configure CMake for Win32 (x86)
        # 这里强制开启 opencv_world 以生成你需要的单一 lib 文件
        run: |
          cmake -S opencv_src -B build_x86 `
            -G "Visual Studio 17 2022" -A Win32 `
            -DBUILD_opencv_world=ON `
            -DBUILD_EXAMPLES=OFF `
            -DBUILD_TESTS=OFF `
            -DBUILD_PERF_TESTS=OFF `
            -DBUILD_JAVA=OFF `
            -DBUILD_opencv_python2=OFF `
            -DBUILD_opencv_python3=OFF `
            -DINSTALL_CREATE_DISTRIB=ON

      - name: Build Debug Version
        run: cmake --build build_x86 --config Debug --target INSTALL -j 4

      - name: Build Release Version
        run: cmake --build build_x86 --config Release --target INSTALL -j 4

      - name: Upload Finished Libs
        uses: actions/upload-artifact@v4
        with:
          name: OpenCV-4.1.3-VS2022-x86-Prebuilt
          path: build_x86/install/
