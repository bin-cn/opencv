name: Build OpenCV 4.13.0 x86 VS2022 Stable

on: 
  workflow_dispatch:

jobs:
  build_x86:
    runs-on: windows-2022

    steps:
      - name: Download OpenCV 4.13.0 Source
        shell: pwsh
        run: |
          Write-Host "正在下载 OpenCV 4.13.0..."
          Invoke-WebRequest -Uri "https://sourceforge.net/projects/opencvlibrary/files/4.13.0/opencv-4.13.0.zip" `
            -OutFile "opencv.zip" `
            -UseBasicParsing
          
          Write-Host "正在解压..."
          Expand-Archive -Path opencv.zip -DestinationPath . -Force
          
          Write-Host "正在重命名文件夹..."
          Rename-Item -Path "opencv-4.13.0" -NewName "opencv_src" -Force
          
          Write-Host "下载完成！"

      - name: Install Dependencies
        run: |
          choco install cmake -y
          cmake --version

      - name: Configure CMake for Win32
        run: |
          cmake -S opencv_src -B build_x86 `
            -G "Visual Studio 17 2022" -A Win32 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_opencv_world=ON `
            -DBUILD_EXAMPLES=OFF `
            -DBUILD_TESTS=OFF `
            -DBUILD_PERF_TESTS=OFF `
            -DBUILD_JAVA=OFF `
            -DCMAKE_INSTALL_PREFIX=install

      - name: Build Release
        run: |
          cmake --build build_x86 --config Release -j 4

      - name: Install Release
        run: |
          cmake --install build_x86 --config Release

      - name: Verify install directory
        shell: pwsh
        run: |
          Write-Host "检查当前目录..."
          Get-ChildItem -Path "." -Name | head -20
          
          Write-Host ""
          Write-Host "检查 install 目录..."
          if (Test-Path "install") {
            Write-Host "✓ install 目录存在"
            Write-Host ""
            Get-ChildItem -Path "install" -Recurse -Name | head -50
            Write-Host ""
            Write-Host "总文件数："
            (Get-ChildItem -Path "install" -Recurse | Measure-Object).Count
          } else {
            Write-Host "✗ install 目录不存在！"
          }

      - name: Upload Finished Libs
        uses: actions/upload-artifact@v4
        with:
          name: OpenCV-4.13.0-VS2022-x86
          path: install/
          if-no-files-found: error
          retention-days: 90
